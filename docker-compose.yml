version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-detection-backend
    ports:
      - "8000:8000"
    environment:
      - COGNODB_URI=${COGNODB_URI}
      - COGNODB_USERNAME=${COGNODB_USERNAME}
      - COGNODB_PASSWORD=${COGNODB_PASSWORD}
      # For local development, use localhost; for production, use CORS_ORIGINS env var
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://frontend:3000}
      - AUTO_SEED_ON_STARTUP=${AUTO_SEED_ON_STARTUP:-true}
    depends_on:
      - neo4j  # Optional: if using local Neo4j
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fraud-detection-frontend
    ports:
      - "3000:3000"
    environment:
      # For local development, use localhost; for production, use VITE_API_URL env var
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - fraud-detection-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Local Neo4j Database (for development)
  # Uncomment below if you want to use a local Neo4j instance instead of managed CognoDB
  # neo4j:
  #   image: neo4j:5.14-enterprise
  #   container_name: fraud-detection-neo4j
  #   ports:
  #     - "7687:7687"  # Bolt port
  #     - "7474:7474"  # HTTP port
  #   environment:
  #     - NEO4J_AUTH=neo4j/password
  #     - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
  #   volumes:
  #     - neo4j_data:/var/lib/neo4j/data
  #   networks:
  #     - fraud-detection-network
  #   restart: unless-stopped

networks:
  fraud-detection-network:
    driver: bridge

